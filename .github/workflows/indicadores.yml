name: Indicadores
# Dias úteis, de hora em hora (8h20 às 19h20 de Brasília): dólar, Ibovespa, Selic, IPCA 12 meses e desemprego
# de fontes públicas (Banco Central, IBGE, cotações), gravados em indicadores.json. O app junta com o feed.
# Também guarda o histórico de cada um em series/*.json (gráficos do app com "serie": "selic", sem digitar números).
on:
  schedule:
    - cron: "20 11-22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/indicadores.py, .github/workflows/indicadores.yml]
permissions:
  contents: write
concurrency:
  # um grupo por robô: o GitHub CANCELA a execução pendente quando outra entra no mesmo grupo, e com um grupo só
  # para todos uma execução podia ser descartada (cada robô grava arquivos diferentes; o push tenta de novo).
  group: prumo-indicadores
  cancel-in-progress: false
jobs:
  indicadores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Buscar os números
        run: python3 -I tools/indicadores.py indicadores.json --series series
      - name: Gravar
        run: |
          git config user.name "prumo-robo"
          git config user.email "prumo-robo@users.noreply.github.com"
          git add indicadores.json
          if [ -d series ]; then git add series; fi
          git diff --cached --quiet && exit 0
          git commit -q -m "Indicadores $(TZ=America/Sao_Paulo date +'%d/%m %Hh%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 10)); done; exit 1
