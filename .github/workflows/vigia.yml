name: Vigia do app
# 25/11: a parte mecânica do testador, sem IA e sem gastar créditos do Claude. A cada 3 h abre o site real em três
# celulares simulados (fonte/testador/vigia.js) e grava vigia.json: erro no app, página rolando de lado, texto
# cortado, busca vazia, notícia com a hora vencida ou com fato novo não escrito, foto contra a regra única, foto
# repetida, descrição em inglês, Acabou de sair repetido, prévia do link sem imagem. O Testador (Claude, 1x por dia)
# lê esse arquivo e o Corretor só roda quando há trabalho.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prumo-vigia
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-24.04   # o Playwright 1.56 ainda não aceita o ubuntu 26.04
    timeout-minutes: 25
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navegador
        working-directory: fonte
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Vigiar o site
        run: node fonte/testador/vigia.js vigia.json
      - name: Gravar
        run: |
          git config user.name "prumo-robo"
          git config user.email "prumo-robo@users.noreply.github.com"
          git add vigia.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Vigia $(TZ=America/Sao_Paulo date +'%d/%m %Hh%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 10)); done; exit 1
