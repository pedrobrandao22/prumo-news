name: Fotos de arquivo
# Uma vez por dia (e quando o script muda): busca no Wikimedia Commons fotos livres de pessoas e assuntos
# das notícias e grava fotos-arquivo.json. O app usa quando a pauta não tem foto própria. Sem IA e sem chave.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/fotos_arquivo.py, .github/workflows/fotos.yml]
permissions:
  contents: write
concurrency:
  group: prumo-escrita
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Buscar fotos
        run: python3 -I tools/fotos_arquivo.py feed.json fotos-arquivo.json
      - name: Gravar
        run: |
          git config user.name "prumo-robo"
          git config user.email "prumo-robo@users.noreply.github.com"
          git add fotos-arquivo.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Fotos de arquivo $(TZ=America/Sao_Paulo date +'%d/%m %Hh%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done; exit 1
