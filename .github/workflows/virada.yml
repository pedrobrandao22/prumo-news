name: Virada da meia-noite
# 0h05 de Brasília: recalcula a edição, tira o que venceu e troca "hoje", "amanhã", "nesta quarta"
# pelo dia com a data. Sem IA (antes era uma rodada do Claude).
on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # um grupo por robô: o GitHub CANCELA a execução pendente quando outra entra no mesmo grupo, e com um grupo só
  # para todos uma execução podia ser descartada (cada robô grava arquivos diferentes; o push tenta de novo).
  # páginas, fotos e virada gravam m/: ficam no mesmo grupo para não brigar pelo mesmo arquivo.
  group: prumo-m
  cancel-in-progress: false
jobs:
  virada:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Virar, registrar e gravar
        # Sempre a partir do main mais novo, como o "Feed leve": o feed.json é uma linha só, então qualquer publicação
        # no meio (uma sessão do Claude de madrugada) dava conflito no pull --rebase e a virada se perdia nas 4
        # tentativas. Agora cada tentativa refaz tudo (virada, rodadas.json, páginas e leve) sobre o main novo; o push
        # só passa se ninguém mexeu depois do fetch, então o leve sempre corresponde ao feed.json gravado.
        run: |
          git config user.name "prumo-robo"
          git config user.email "prumo-robo@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -I tools/virada_auto.py feed.json --relatorio virada.txt | tee saida.txt
            grep '^REG ' saida.txt | sed 's/^REG //' > reg.json
            python3 - <<'PY'
          import json, datetime
          reg = json.load(open("reg.json", encoding="utf-8"))
          ag = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-3)))
          try: r = json.load(open("rodadas.json", encoding="utf-8"))
          except Exception: r = {}
          if r.get("dia") != ag.date().isoformat(): r = {"dia": ag.date().isoformat(), "itens": {}}
          r.setdefault("itens", {})[ag.strftime("%Hh%M")] = reg
          json.dump(r, open("rodadas.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
            # commits do robô não disparam o workflow das páginas nem o do leve: atualiza aqui mesmo (se falhar, grava assim mesmo;
            # o app usa o feed.json e o robô "Feed leve" refaz em até 1 h)
            python3 -I tools/paginas.py feed.json m || echo "páginas falharam; a virada segue"
            python3 -I tools/feed_leve.py feed.json || echo "feed leve falhou; a virada segue"
            git add feed.json rodadas.json m
            git add -A feed-leve.json feed-det 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "Virada $(TZ=America/Sao_Paulo date +'%d/%m')"
            git push -q && exit 0
            echo "o main mudou durante a virada: refaz a partir do main novo"; sleep $((i * 10))
          done; exit 1
