name: Avisos de erro
# Copia os avisos de "Achei um erro" (sem o nome de quem mandou) para erros-abertos.json,
# que as rodadas automáticas leem. Usa só a chave publicável, que já é pública no app.
# A cada 30 min das 6h às 23h30 de Brasília (as rodadas vão das 6h52 às 22h48; de madrugada ninguém lê).
on:
  schedule:
    - cron: "*/30 9-23,0-2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: erros
  cancel-in-progress: false
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar avisos
        run: |
          curl -sf -X POST "https://kkzcljusiotoklldaupg.supabase.co/rest/v1/rpc/erros_abertos" \
            -H "apikey: sb_publishable_s1mSA4gcb2qs6kVRZYQZ-g_BsvwvdIA" \
            -H "Content-Type: application/json" -d '{}' -o novo.json
          python3 -c "import json,sys;d=json.load(open('novo.json'));isinstance(d,list) or sys.exit('resposta não é lista: mantém o arquivo');json.dump(d,open('erros-abertos.json','w'),ensure_ascii=False,indent=1)"
          rm novo.json
      - name: Gravar se mudou
        run: |
          git config user.name "prumo-robo"
          git config user.email "prumo-robo@users.noreply.github.com"
          git add erros-abertos.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Avisos de erro atualizados"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 10)); done; exit 1
