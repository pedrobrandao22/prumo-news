name: Dados oficiais
# Dias úteis, de hora em hora (8h25 às 23h25 de Brasília, antes das Manchetes das :35): votações e pauta do
# plenário da Câmara e do Senado, Copom/Selic e Focus (Banco Central), IPCA e desemprego (IBGE), de APIs abertas
# e sem chave, gravados em oficiais.json com o texto pronto de cada fato e a pauta do feed a que ele se liga.
# Sem IA. Fonte que falhar mantém o que já estava; se nada mudou, não há commit.
on:
  schedule:
    - cron: "25 11-23 * * 1-5"
    - cron: "25 0-2 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/oficiais.py, tools/test_oficiais.py, .github/workflows/oficiais.yml]
permissions:
  contents: write
concurrency:
  # um grupo por robô: o GitHub CANCELA a execução pendente quando outra entra no mesmo grupo, e com um grupo só
  # para todos uma execução podia ser descartada (cada robô grava arquivos diferentes; o push tenta de novo).
  group: prumo-oficiais
  cancel-in-progress: false
jobs:
  oficiais:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Testes (offline, só quando o código muda)
        if: github.event_name == 'push'
        run: python3 -I tools/test_oficiais.py
      - name: Buscar os dados oficiais
        run: python3 -I tools/oficiais.py feed.json oficiais.json
      - name: Gravar
        run: |
          git config user.name "prumo-robo"
          git config user.email "prumo-robo@users.noreply.github.com"
          git add oficiais.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Oficiais $(TZ=America/Sao_Paulo date +'%d/%m %Hh%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 10)); done; exit 1
