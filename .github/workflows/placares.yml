name: Placares ao vivo
# 25/11: o resultado dos jogos da Agenda entra sozinho no app (tools/placares.py; placar público da ESPN, sem chave e
# sem IA). Só grava placares.json quando muda; o app mostra "Ao vivo: …" / "Terminou: …" no alto da notícia.
on:
  schedule:
    - cron: "*/10 14-23 * * *"   # 11h às 20h50 de Brasília
    - cron: "*/10 0-3 * * *"     # 21h à 0h50 de Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prumo-placares
  cancel-in-progress: false
jobs:
  placares:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testar
        run: python3 -I tools/test_placares.py
      - name: Placares
        run: python3 -I tools/placares.py feed.json placares.json
      - name: Gravar
        run: |
          git config user.name "prumo-robo"
          git config user.email "prumo-robo@users.noreply.github.com"
          git add placares.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Placares $(TZ=America/Sao_Paulo date +'%d/%m %Hh%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 10)); done; exit 1
