<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Prumo News</title>
<meta name="description" content="Os fatos no centro. Os ângulos ao lado.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prumo News">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Prumo News">
<meta property="og:description" content="As notícias que importam, curtas, sem viés e sempre atualizadas. Os fatos no centro, os ângulos ao lado.">
<meta property="og:url" content="https://prumonews.com.br/">
<meta property="og:image" content="https://prumonews.com.br/og-padrao.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prumo">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: feed de leitura em uma coluna, sempre em papel claro. Topo com uma bolinha por seção; cada post tem uma capa 5:4 com a manchete sobre a ilustração e, embaixo, o texto em abas (Resumo · Ângulos · Veículos). Tipografia: Literata no texto corrido, Atkinson Hyperlegible Next na interface e nas manchetes, Atkinson Hyperlegible Mono nos dados */
:root{
  color-scheme:light;
  /* Prumo News · tinta, papel e bronze */
  --bg:#f3f4f6;          /* papel */
  --card:#ffffff;        /* cartões */
  --ink:#14213a;         /* tinta: texto e marca */
  --ink-2:#2c3a52;       /* texto corrido secundário */
  --muted:#5b6b7f;       /* ardósia: metadados */
  --line:#dde2e9; --soft:#edf0f4; --chip:#e6eaf0;
  --accent:#24406b; --accent-soft:#e3e8f0;   /* azul-tinta: links e ações */
  --bronze:#c9822b; --bronze-ink:#8a5a17; --bronze-soft:#f6ecdc;  /* o peso do prumo: conferido, novo */
  --hot:#b3412f;                              /* erro, atraso */
  --right:#1d4e89; --right-soft:#e9f0f9; --left:#a3352a; --left-soft:#faeeec;
  --me:#14213a; --me-ink:#ffffff; --them:#e6eaf0;
  --s-politica:#1d3a63; --s-economia:#24533c; --s-brasil:#6e4419; --s-mundo:#46337a; --s-educacao:#7a2b37; --s-esportes:#1e5a60;
  --ill-bg:#e3e8f0; --ill-ink:#14213a; --ill-a:#1d3a63; --ill-b:#c9822b; --ill-c:#ffffff; --ill-mute:#b7c0cc; --ill-deep:#cfd7e3;
  --shade:rgb(20 33 58 / .5);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"Public Sans",system-ui,sans-serif;
  --nav-h:62px; --nav-pad:8px;
}
.paper{--ill-ink:#14213a; --ill-b:#c9822b; --ill-c:#ffffff; --ill-mute:#b7c0cc; --ill-deep:#cfd7e3; --ill-bg:#e3e8f0; --ill-a:#1d3a63; color:#14213a}
.paper[data-sec="politica"]{--ill-bg:#e3e8f0; --ill-a:#1d3a63; --ill-deep:#cbd5e3}
.paper[data-sec="economia"]{--ill-bg:#e4ece7; --ill-a:#24533c; --ill-deep:#cddcd3}
.paper[data-sec="brasil"]{--ill-bg:#efe7dc; --ill-a:#6e4419; --ill-deep:#dfd2c0}
.paper[data-sec="mundo"]{--ill-bg:#e8e4ef; --ill-a:#46337a; --ill-deep:#d5cee3}
.paper[data-sec="educacao"]{--ill-bg:#f1e3e5; --ill-a:#7a2b37; --ill-deep:#e3ccd0}
.paper[data-sec="esportes"]{--ill-bg:#e1edef; --ill-a:#1e5a60; --ill-deep:#c9dde0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--nav-h) + var(--nav-pad) + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:22px;height:22px;display:block;flex:none}
.ico *{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{height:54px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{width:15px;height:26px;flex:none}
.word{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1;letter-spacing:-.025em}
.word small{font-family:var(--f-ui);font-size:9.5px;font-weight:700;letter-spacing:.22em;color:var(--bronze-ink);margin-left:5px;vertical-align:.45em}
.ed{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.secs{display:flex;gap:12px;overflow-x:auto;padding-block:12px 8px;scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.sb{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:5px}
.sb svg.ring{width:66px;height:66px;display:block}
.sb .wrap{position:relative;width:66px;height:66px}
.sb .face{width:52px;height:52px;border-radius:50%;overflow:hidden;position:absolute;top:7px;left:7px}
.sb .face svg{width:100%;height:100%;display:block}
.sb b{font-weight:700;font-size:12.5px;line-height:1.2}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font-size:14px;font-weight:600;border-radius:8px;padding:10px 14px;min-height:40px;background:var(--chip);color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}

#posts{display:flex;flex-direction:column;gap:12px;padding-block:4px}
.post{background:var(--card);border-block:1px solid var(--line);padding-bottom:14px;scroll-margin-top:110px}
.ph{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.secdot{width:10px;height:10px;border-radius:3px;flex:none}
.ph-t{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.ph-t b{font-weight:700;font-size:14px}
.ph-t span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.meter{display:flex;gap:2px;align-items:center}
.meter i{width:5px;height:13px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--ink)}

.cover{position:relative;aspect-ratio:5/4;max-width:100%;overflow:hidden;background:var(--ill-bg)}
.cover>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover .cv{position:absolute;left:0;right:0;bottom:0;padding:56px 18px 16px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(to bottom,transparent,var(--ill-bg) 42%)}
.kick{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ill-a);font-weight:600}
.cover h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(21px,6.2vw,27px);line-height:1.12;letter-spacing:-.012em;text-wrap:balance;color:var(--ill-ink)}
.cover h2.long{font-size:clamp(18px,5.2vw,22px)}
.cover .lab{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--ill-ink);background:rgb(255 255 255 / .8);border-radius:5px;padding:2px 6px}

.acts{display:flex;align-items:center;gap:6px;padding-top:12px}
.act{height:40px;display:flex;align-items:center;gap:5px;padding:0 10px 0 8px;border-radius:9px;background:var(--chip);font-size:13px;flex:none;font-weight:600;color:var(--ink-2)}
.act.on{background:var(--bronze-soft);color:var(--bronze-ink)}
.act.on .ico .dotc,.sact.on .ico .dotc{fill:var(--bronze);stroke:var(--bronze-ink)}
.act.saved{background:var(--ink);color:#fff}
.acts .sp{flex:1}
.likes{font-size:14px;color:var(--muted);padding-top:8px}
.likes:empty{display:none}
.likes b{color:var(--ink);font-weight:700}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:12px}
.tabs button{padding:9px 10px 8px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding-top:12px;display:flex;flex-direction:column;gap:10px}
.panel p{margin:0}
.lead{font-family:var(--f-body);font-size:17px;line-height:1.62;color:var(--ink)}
.lead.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--accent);font-size:14px;font-weight:600;align-self:flex-start}
.note{font-family:var(--f-body);font-size:15px;line-height:1.55;color:var(--ink-2)}
.note b{font-family:var(--f-ui);font-weight:700;color:var(--ink)}
.ang{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.ang.r{background:var(--right-soft)}.ang.l{background:var(--left-soft)}
.ang .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.ang.r .lbl{color:var(--right)}.ang.l .lbl{color:var(--left)}
.ang b{font-weight:700;font-size:17px;line-height:1.25}
.ang span.x{font-family:var(--f-body);font-size:15px;line-height:1.55}
.hint{font-size:13px;color:var(--muted)}
.enq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.enq li{display:flex;flex-direction:column;gap:1px;font-family:var(--f-body);font-size:15px;line-height:1.5}
.enq li b{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
.link{color:var(--accent);font-size:14px;font-weight:600;align-self:flex-start;text-align:left}
.cmts{display:flex;flex-direction:column;gap:4px;padding-top:10px}
.cmts:empty{display:none}
.cmt{font-size:15px;line-height:1.45}
.cmt b{font-weight:700;margin-right:5px}
.sech{display:flex;align-items:center;gap:10px;padding-block:14px 2px;flex-wrap:wrap}
.sech i{width:12px;height:12px;border-radius:3px;flex:none}
.sech h4{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:21px}
.sech span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.sec{padding-block:18px 8px;display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brv{list-style:none;margin:0;padding:0}
.brv li{border-top:1px solid var(--line);padding:11px 0;display:flex;flex-direction:column;gap:2px}
.brv li:first-child{border-top:0}
.brv a{font-weight:700;font-size:16px;line-height:1.3;text-decoration:none}
.brv span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.foot{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;padding-block:8px 24px}
.foot p{margin:0}.foot b{color:var(--ink);font-weight:700}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgb(255 255 255 / .74);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid rgb(20 33 58 / .08);padding-bottom:calc(var(--nav-pad) + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px;gap:6px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);position:relative;font-size:11.5px;font-weight:700;border-radius:12px;-webkit-tap-highlight-color:transparent}
.nav button .ico{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink);background:rgb(20 33 58 / .07)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:6px;background:var(--bronze);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

.view-h{display:flex;align-items:center;gap:10px;height:54px}
.view-h h1{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:23px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:var(--accent)}
.people{list-style:none;margin:0;padding:0}
.people li button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 0;text-align:left}
.people .av{width:52px;height:52px;font-size:20px}
.people .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.people .pt b{font-weight:700}
.people .pt span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people .pt span.unread{color:var(--ink);font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;background:var(--bronze);flex:none}
.thread{display:flex;flex-direction:column;gap:8px;padding-block:12px 90px}
.msg{max-width:80%;display:flex;flex-direction:column;gap:4px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.bub{border-radius:14px;padding:9px 13px;background:var(--them);font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine .bub{background:var(--me);color:var(--me-ink)}
.share{width:240px;max-width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;display:flex;flex-direction:column;background:var(--ill-bg)}
.share svg{display:block;width:100%;height:auto}
.share div{padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.share b{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:15px;line-height:1.2;color:var(--ill-ink)}
.share span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ill-a);font-weight:600}
.mt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--nav-pad) + env(safe-area-inset-bottom,0px));z-index:15;background:var(--card);border-top:1px solid var(--line);padding-block:8px}
.composer form{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.field{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--card);font-size:16px}
.send{font-weight:700;color:var(--accent);padding:8px 4px}
.send:disabled{opacity:.4}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-block:6px 20px}
.gi{aspect-ratio:5/4;background:var(--ill-bg);position:relative;overflow:hidden;text-align:left;border-radius:8px}
.gi svg{position:absolute;inset:0;width:100%;height:100%}
.gi b{position:absolute;left:0;right:0;bottom:0;padding:30px 9px 9px;background:linear-gradient(to bottom,transparent,var(--ill-bg) 45%);font-weight:800;font-size:13.5px;line-height:1.15;color:var(--ill-ink)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:15px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:16.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.card p{margin:0}.card b{font-weight:700}
.btn{background:var(--ink);color:#fff;font-weight:700;border-radius:10px;padding:11px 16px;text-align:center}
.btn.ghost{background:var(--chip);color:var(--ink)}
.me-head{display:flex;align-items:center;gap:14px;padding-block:14px}
.me-head .av{width:72px;height:72px;font-size:28px}
.me-head b{font-size:19px;font-weight:700;display:block}
.me-head span{color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;padding-block:4px 14px}
.stats b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}

.scrim{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86%;background:var(--card);border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
.sh-h{display:flex;align-items:center;justify-content:center;position:relative;height:44px;font-weight:700;border-bottom:1px solid var(--line)}
.sh-h button{position:absolute;right:8px;top:0;height:44px;padding:0 10px;color:var(--muted);font-weight:600}
.sh-b{overflow-y:auto;padding-block:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.sh-f{border-top:1px solid var(--line);padding-block:8px}
.sh-f form{display:flex;gap:8px;align-items:center}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.clist li{display:flex;gap:10px}
.clist .av{width:32px;height:32px;font-size:13px}
.clist div{display:flex;flex-direction:column;font-size:15px;line-height:1.45;min-width:0}
.clist div span{overflow-wrap:anywhere}
.clist div i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:16px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;font-size:13px}
.pick .av{width:60px;height:60px;font-size:22px;outline:3px solid transparent;outline-offset:2px}
.pick button[aria-pressed="true"] .av{outline-color:var(--accent)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rows li{display:flex;flex-direction:column;gap:2px;font-size:15px}
.rows li span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rows a{font-family:var(--f-body);line-height:1.5;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* story: papel da seção; arte limitada a um terço da tela */
.story{position:fixed;inset:0;z-index:50;background:var(--ill-bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.story-in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
.bars{display:flex;gap:3px;padding:10px 12px 6px}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--ill-mute)}
.bars i.on{background:var(--ill-a)}
.s-h{display:flex;align-items:center;justify-content:space-between;padding:2px 12px 4px}
.s-h b{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ill-a)}
.s-h button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ill-ink)}
.s-body{flex:1;display:flex;flex-direction:column;gap:14px;padding:0 20px 12px;overflow-y:auto;min-height:0}
.s-art{display:flex;justify-content:center}
.s-art svg{display:block;width:100%;height:auto;max-height:30vh;border-radius:10px}
.s-body h2{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:clamp(23px,6.6vw,30px);line-height:1.12;color:var(--ill-ink);text-wrap:balance}
.s-body p{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.62;color:var(--ill-ink)}

:root:not([data-aparencia="claro"]) .top.rolou{background:rgb(0 0 0 / .66)!important}}
/* reduzir transparência (ajuste do app, e o pedido do sistema onde o navegador informa) */
html.sem-vidro .nav,html.sem-vidro .sheet,html.sem-vidro .top.rolou,html.sem-vidro .composer,html.sem-vidro .ptr{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--card)!important}
html.sem-vidro .nav::before{display:none}
html.sem-vidro .scrim{-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-transparency:reduce){.nav,.sheet,.top.rolou,.composer,.ptr{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--card)!important}.nav::before{display:none}}
@media (prefers-reduced-motion:reduce){.nav,.nav-in,.top,.sheet,.scrim,.app>section.entra,.nav .ico,.nav .lbl{animation:none!important;transition:none!important}}

/* ================= Etapa 2: coberturas ================= */
.ph-sub{font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.cst{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 6px;flex:none}
.cst.vivo{background:#d93025;color:#fff}
.cst.vivo i{width:6px;height:6px;border-radius:50%;background:#fff;animation:cstp 1.4s ease-in-out infinite}

.cst.enc{background:var(--chip);color:var(--muted)}
.cobbar{display:flex;align-items:center;gap:8px;width:100%;margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:var(--chip);text-align:left;font-size:13.5px;color:var(--ink-2,var(--ink));min-height:44px}

.txs.pt{min-height:0!important;max-height:none!important;gap:10px}
.txs.pt .pt-k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.txs.pt h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:calc(20px*var(--fz));line-height:1.22;color:var(--ink)}
.txs.pt .lead{margin:0}
.pc{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.pc-k{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted)}
.pc-k .secdot{width:8px;height:8px;border-radius:50%;flex:none}
.pc h2{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;font-size:24px;line-height:1.18;color:var(--ink)}
.pc-m{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pc-a{display:flex;gap:8px;flex-wrap:wrap}
.pc-a .btn{flex:1;min-width:130px}
.pc h4{margin:8px 0 0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.pc .lead,.pc .note{margin:0}
.etp{list-style:none;margin:2px 0 0;padding:0;display:flex;gap:4px}
.etp li{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11.5px;line-height:1.25;color:var(--muted)}
.etp li::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.etp li.ok::before{background:var(--accent)}
.etp li.at{color:var(--ink);font-weight:700}
.etp li.at::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.faq details{border-bottom:1px solid var(--line);padding:2px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;padding:11px 0;font-weight:700;font-size:15px;color:var(--ink)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:400;color:var(--muted);font-size:18px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 12px;font-size:15px;line-height:1.55;color:var(--ink-2,var(--ink))}
.pct{list-style:none;margin:4px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.pct li{position:relative;display:flex;flex-direction:column;gap:3px;font-size:14.5px;line-height:1.45;color:var(--ink)}

.pct li.tt::before{border-color:var(--accent);background:var(--accent)}
.pct li.fx::before{border-color:#b26b00}
.pct small{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pct li.tt b{font-family:var(--f-display);font-size:16px;line-height:1.25}
.pc .cobx2{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px;border-radius:12px;background:var(--chip);font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.segs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 10px}
.segs::-webkit-scrollbar{display:none}
.segs-h{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted);padding-top:8px}
.segc{flex:0 0 auto;width:min(250px,72vw);max-width:250px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 12px;border-radius:12px;background:var(--chip);text-align:left}
.segc b{font-size:13.5px;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.segc span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.segc span i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sres .dorm span::before{content:"⏸ "}

/* ================= Etapa 3: capa e menu ================= */
.cp{padding-bottom:28px}
.cp-top{display:flex;flex-direction:column;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 10px;border-bottom:3px double var(--ink);margin-bottom:14px;text-align:center}

.cp-ed{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cp-vivo{display:flex;flex-direction:column;gap:6px;background:#d93025;color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.cp-vivo b{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.cp-vivo button{color:#fff;text-align:left;font-weight:700;font-size:15px;line-height:1.3}
.cp-k{font-family:var(--f-ui);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cp-man{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding-bottom:16px;border-bottom:1px solid var(--line)}
.cp-man .art{border-radius:12px;overflow:hidden}
.cp-man h2{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;font-size:calc(29px*min(var(--fz),1.15));line-height:1.1;color:var(--ink);text-wrap:balance}
.cp-man p{margin:0;font-family:var(--f-body);font-size:calc(17px*var(--fz));line-height:1.5;color:var(--ink-2)}
.cp-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.cp-fixa{font-size:11px;font-weight:800;color:var(--bronze-ink);background:var(--bronze-soft);border-radius:5px;padding:2px 6px}
.cp-dest{display:grid;grid-template-columns:1fr;gap:0}
.cp-dest>button{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.cp-dest .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cp-dest b{font-family:var(--f-display);font-weight:700;font-size:calc(18.5px*min(var(--fz),1.15));line-height:1.18;color:var(--ink)}
.cp-dest span.l{font-size:14px;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cp-th{width:92px;flex:none;aspect-ratio:5/3;border-radius:8px;overflow:hidden}
.cp-th svg{display:block;width:100%;height:100%}
.cp .lida{opacity:.55}
.cp .lida b::after{content:" ✓";font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.cp-ind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0 4px}

.cp-ind div{background:var(--soft);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:1px}

.cp-ind b{font-size:18px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.cp-ind em{font-style:normal;font-size:12px;font-weight:700}
.cp-ind em.sobe{color:#1f7a4d}.cp-ind em.desce{color:var(--hot)}.cp-ind em.estavel{color:var(--muted)}
.cp-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 2px;padding-top:10px;border-top:2px solid var(--ink)}
.cp-h h3{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.cp-h h3 i{width:10px;height:10px;border-radius:3px}
.cp-h button{font-size:13.5px;font-weight:700;color:var(--accent)}
.cp-l{list-style:none;margin:0;padding:0}
.cp-l li>button{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.cp-l li:last-child>button{border-bottom:0}
.cp-l b{font-size:calc(16px*var(--fz));line-height:1.3;font-weight:700;color:var(--ink)}

.cp-int{display:flex;align-items:center;gap:12px;margin-top:22px;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:14px;width:100%;text-align:left}

.cp-int span{font-size:13.5px}
.cp-int .chev{margin-left:auto;font-size:20px}
.cp-fim{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:26px;padding:20px 0 6px;border-top:3px double var(--ink);color:var(--muted);font-size:14.5px}
.cp-fim b{color:var(--ink);font-size:17px}
.cp-sk i{display:block;border-radius:10px;background:var(--chip);margin:12px 0;animation:skp 1.2s ease-in-out infinite alternate}
/* aba Buscar */
.bv-f{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px}
.bv-f .field{width:100%;border-radius:12px;padding:12px 14px;font-size:16px}
.bv-sec{margin-top:18px}
.bv-sec>h3{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bv-g{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.bv-g>b{display:flex;align-items:center;gap:7px;font-size:15px;margin:8px 0 2px}
.bv-g>b i{width:9px;height:9px;border-radius:3px}

.bv-it{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;padding:8px 0;font-size:15px;line-height:1.3;border-bottom:1px solid var(--line)}

.bv-chips{display:flex;flex-wrap:wrap;gap:8px}
.vback{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;font-size:14.5px;margin-left:-6px;min-height:40px;padding-right:6px}
/* admin: capa */
.adm-capa .pin{background:var(--bronze-soft);color:var(--bronze-ink);border-radius:10px;padding:10px 12px;font-size:14px}

.sech{flex-wrap:wrap!important;row-gap:2px}

.sh4-tr{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:8px 0;border-top:1px solid var(--line)}

.sh4-tr .etp li{font-size:10.5px}
.sh4-cal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sh4-cal li{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.35}
.sh4-cal li:first-child{border-top:0}
.sh4-cal time{flex:none;min-width:70px;font-family:var(--f-ui);font-size:12.5px;font-weight:800;color:var(--accent)}

.sh4-ind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sh4-ind div{background:var(--soft);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sh4-ind span{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sh4-ind b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.sh4-ind em{font-style:normal;font-size:12px;font-weight:700}
.sh4-ind em.sobe{color:#1f7a4d}.sh4-ind em.desce{color:var(--hot)}.sh4-ind em.estavel{color:var(--muted)}
.sh4-ind svg{width:100%;height:28px;display:block;margin-top:2px}
.sh4-ind small{font-size:11px;color:var(--muted)}
.sh4-srv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sh4-srv li{font-size:14.5px;line-height:1.4}
.sh4-srv a{color:var(--accent);font-weight:700}
.sh4-cf{display:flex;flex-wrap:wrap;gap:8px}
.sh4-cf button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--soft);border-radius:12px;padding:9px 12px;max-width:100%}
.sh4-cf button b{font-size:14.5px;color:var(--ink)}
.sh4-cf button span{font-size:12px;color:var(--muted)}
.pc-ess{background:#fdecea;border-left:4px solid #d93025;border-radius:0 12px 12px 0;padding:10px 12px}

.pc-br{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5}
.pc-br b{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
:root[data-aparencia="escuro"] .pc-ess{background:#3a1d1a}
@media (prefers-color-scheme:dark){:root:not([data-aparencia="claro"]) .pc-ess{background:#3a1d1a}}

/* ================= Etapa 5: esportes ================= */
.esp{display:flex;flex-direction:column;gap:14px;padding-bottom:14px}
.esp-mt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.esp-mt .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.esp-mt .hd b{font-size:17px}
.esp-mt .hd span{font-size:13px;font-weight:700;color:var(--muted)}
.esp-mt .tr{font-size:13px;font-weight:700;color:var(--accent)}
.esp-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:700}
.jg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.jg li{border-top:1px solid var(--line)}

.jg .w{color:var(--ink)}.jg .l{color:var(--muted);font-weight:600}
.esp-sub{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 0}

.tab tr.meu td{background:var(--bronze-soft)}
.tab td button{font:inherit;font-weight:700;text-align:left}
.vde{display:flex;gap:4px}
.vde i{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11.5px;font-weight:800;color:#fff}

.chv{display:flex;flex-direction:column;gap:6px}
.chv .cf{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-top:6px}
.chv .cj{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.chv .cj span{font-size:12.5px;color:var(--muted)}
.tpick{display:flex;flex-wrap:wrap;gap:8px}
.tpick button{height:38px;padding:0 14px;border-radius:19px;background:var(--chip);font-weight:700;font-size:14px}
.tpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ================= Etapa 6: acabamentos ================= */
[data-capair],[data-busca],[data-goto],.svr,[data-cobpag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.lp{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + var(--nav-pad) + 20px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:999px;background:rgb(255 255 255 / .82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgb(20 33 58 / .12);box-shadow:0 4px 14px rgb(20 33 58 / .14);font:700 12.5px var(--f-ui);color:var(--ink-2);-webkit-tap-highlight-color:transparent}

function tickerItens(lim=10){
  if(!FEED)return [];const out=[],vis=new Set(),ocultas=PREF.ocultas||[];
  const ref=new Date(FEED.atualizado_em).getTime()||Date.now(),dia=864e5;
  const ok=p=>p&&!ocultas.includes(secOf(p))&&!silenciado(p);
  const ultimaUpd=p=>(p.atualizacoes||[]).slice().sort((a,b)=>String(b.hora).localeCompare(String(a.hora)))[0];
  ((FEED.mudancas||{}).itens||[]).forEach(i=>{const p=pautaById(i.pid);if(!ok(p)||vis.has(p.id)||!(i.tipo==="nova"||i.tipo==="atualizada"))return;vis.add(p.id);const u=ultimaUpd(p);
    out.push({pid:p.id,tag:i.tipo==="nova"?"Nova":"Atualizada",txt:i.texto||p.neutro?.titulo||"",hora:(i.tipo==="atualizada"&&u?u.hora:p.hora),sec:secOf(p)})});
  const porPrio=[...(FEED.pautas||[])].filter(ok).sort((a,b)=>(b.prioridade||0)-(a.prioridade||0));
  const add=p=>{if(vis.has(p.id)||out.length>=lim)return;vis.add(p.id);const u=ultimaUpd(p);const recente=u&&ref-new Date(u.hora).getTime()<dia;
    out.push({pid:p.id,tag:secNome(secOf(p)),txt:recente?u.texto:(p.neutro?.titulo||""),hora:recente?u.hora:p.hora,sec:secOf(p)})};
  porPrio.filter(p=>{const h=new Date(p.hora).getTime();return h&&ref-h<dia}).forEach(add);
  porPrio.forEach(add);
  return out.slice(0,lim).sort((a,b)=>tms(b.hora)-tms(a.hora));
}
function abrirUltimas(){uso("ultimas");const it=tickerItens(15);const at=new Date(FEED.atualizado_em);
  sheet("Últimas notícias",`<p class="hint" style="margin:0">Atualizado ${isNaN(at)?"":esc(diaHora(FEED.atualizado_em))}. O Prumo confere os veículos de hora em hora. ${proximaRodadaTxt()}</p><ul class="ult">${it.map(i=>`<li><button type="button" data-goto="${esc(i.pid)}"><span class="u-t"><b style="color:${secCor(i.sec)}">${esc(i.tag)}</b>${i.hora?` · ${esc(hhmm(i.hora))}`:""}</span><span class="u-x">${esc(i.txt)}</span></button></li>`).join("")}</ul>`)}
function renderTicker(){
  const tk=$("#ticker"),run=$("#tkrun");if(!tk||!run)return;const it=tickerItens();
  if(!it.length){tk.hidden=true;return}tk.hidden=false;
  const at=new Date(FEED.atualizado_em);const th=$("#tkhora");if(th)th.textContent=isNaN(at)?"":"às "+at.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"}).replace(":","h");
  const one=it.map(i=>`<button type="button" class="tk-i" data-tk="${esc(i.pid)}" tabindex="-1"><b>${esc(i.tag)}</b>${i.hora?`<time>${esc(hhmm(i.hora))}</time>`:""}<span>${esc(i.txt)}</span></button><i class="tk-sep" aria-hidden="true"></i>`).join("");
  run.innerHTML=one+one.replace(/tabindex="-1"/g,'tabindex="-1" aria-hidden="true"');run.querySelectorAll('.tk-i:not([aria-hidden])').forEach(b=>b.tabIndex=0);
  requestAnimationFrame(()=>{TK.w=run.scrollWidth/2;if(!TK.raf)TK.raf=requestAnimationFrame(tkLoop)});
  wireTicker();
}
const TK={x:0,w:0,v:60,paused:false,drag:null,last:0,raf:0,hold:0,wired:false};
const REDUZ=matchMedia("(prefers-reduced-motion: reduce)");
function tkStart(){if(!TK.raf&&$("#tkrun")){TK.last=0;TK.raf=requestAnimationFrame(tkLoop)}}
function tkLoop(ts){const run=$("#tkrun");if(!run||VIEW!=="feed"||document.hidden||$("#ticker")?.hidden){TK.raf=0;TK.last=0;return}if(!(TK.w>0))TK.w=run.scrollWidth/2;
  const dt=TK.last?Math.min(64,ts-TK.last):0;TK.last=ts;
  if(!TK.paused&&!TK.drag&&Date.now()>TK.hold&&!REDUZ.matches&&VIEW==="feed"&&!document.hidden)TK.x-=TK.v*dt/1000;
  if(TK.w>0){while(TK.x<=-TK.w)TK.x+=TK.w;while(TK.x>0)TK.x-=TK.w}
  run.style.transform=`translate3d(${TK.x.toFixed(1)}px,0,0)`;TK.raf=requestAnimationFrame(tkLoop)}
function wireTicker(){if(TK.wired)return;const vp=$(".tk-vp");if(!vp)return;TK.wired=true;
  vp.addEventListener("pointerdown",e=>{TK.drag={x0:e.clientX,start:TK.x,t:Date.now(),moved:false,id:e.pointerId};try{vp.setPointerCapture(e.pointerId)}catch(_){}});
  vp.addEventListener("pointermove",e=>{const d=TK.drag;if(!d)return;const dx=e.clientX-d.x0;if(!d.moved&&Math.abs(dx)>6){d.moved=true;vp.classList.add("drag")}if(d.moved)TK.x=d.start+dx});
  const fim=e=>{const d=TK.drag;if(!d)return;TK.drag=null;vp.classList.remove("drag");
    if(e.type==="pointerup"&&!d.moved&&Date.now()-d.t<350){const el=document.elementFromPoint(e.clientX,e.clientY);
      const pid=(el?.closest(".tk-i")||e.target.closest?.(".tk-i"))?.dataset.tk;if(pid){uso("faixa");vibrar(6);openSnap(pid)}return}
    TK.hold=Date.now()+150};
  vp.addEventListener("pointerup",fim);vp.addEventListener("pointercancel",fim);
  vp.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")TK.paused=true});vp.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")TK.paused=false});
}

  const A=PREF.audio||(PREF.audio={rate:1,voz:""});

    ${vozes.length?`<b>Voz</b><select id="voz" class="field">${vozes.map(v=>`<option value="${esc(v.name)}" ${v.name===A.voz?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select>`:`<p class="hint">As vozes disponíveis dependem do seu celular.</p>`}</div>
    ${falando?`<button type="button" class="btn" data-ouvir="stop">Parar a leitura</button>`:""}`);
  $("#voz")?.addEventListener("change",e=>{A.voz=e.target.value;salvarPrefs()});
  if(!vozes.length&&!abrirAudio._esp){abrirAudio._esp=true;try{speechSynthesis.addEventListener("voiceschanged",()=>{abrirAudio._esp=false;if($("#rateval")&&!$("#voz")&&speechSynthesis.getVoices().some(v=>/^pt/i.test(v.lang)))abrirAudio()},{once:true})}catch(e){}}
}

/* ---------- camada de dados: Supabase com a mesma forma do banco antigo ----------
   db.doc(path)            -> get(), set(data), update(patch), delete(), onSnapshot(next, err)
   db.collection(nome)     -> get(), add(data), where(campo,"==",valor), onSnapshot(next, err)
   db.rpc(nome, args)      -> chama uma função do banco (entrar, criar_convite, pedir_amizade…)
   db.marcarLidas(de)      -> marca como lidas, de uma vez, as mensagens recebidas de alguém
   Coleções especiais: "pessoas" (tabela membros), "mensagens", "erros", "amizades".
   As demais são documentos JSON em public.docs (caminho "colecao/id"). update() mescla no
   servidor (null apaga a chave) e cria o documento se ele não existir.

   Economia (v2, pensando em ~100 pessoas):
   - Cada escuta guarda a sua cópia. Um evento do tempo real já traz a linha (e o Supabase só
     entrega a quem pode ler), então a escuta aplica a linha sem consultar o banco de novo.
   - Gravação própria não recarrega nada: o eco do tempo real atualiza; se o eco não vier em
     alguns segundos, relê só aquele documento.
   - Releitura periódica é incremental (só o que mudou desde a última marca de tempo).
   - Releitura completa só ao abrir, quando muda uma amizade, ao voltar depois de muito tempo
     fora e de hora em hora com o app aberto (pega o que foi apagado, que o tempo real não manda).
*/
function criarDB(sb, uid, opts) {
  opts = opts || {};
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const LIS = new Set();
  const TAB = { pessoas: "membros", mensagens: "mensagens", erros: "erros", amizades: "amizades" };
  const MSG_CAMPOS = ["de", "para", "at", "texto", "pid", "snap", "resp", "tipo", "lida"];
  const ERRO_CAMPOS = ["pid", "titulo", "texto", "edicao", "at"];
  const MSG_MAX = opts.msgMax || 300;                     // mensagens mais recentes por escuta
  const POLL = opts.poll || 5 * 60000;                    // releitura incremental com o app aberto
  const CHEIO_MAX = opts.cheio || 60 * 60000;             // releitura completa com o app aberto
  const FORA_LONGO = opts.foraLongo || 15 * 60000;        // fora do app por mais que isso: releitura completa
  const ECO = opts.eco || 4000;                           // espera pelo eco da própria gravação
  const pick = (o, ks) => { const r = {}; ks.forEach(k => { if (o && o[k] !== undefined) r[k] = o[k] }); return r };
  const erro = (e) => { const x = new Error((e && e.message) || "erro"); x.code = (e && (e.code === "42501" || /row-level security|permission/i.test(e.message || ""))) ? "permission_denied" : (e && e.code) || "unavailable"; return x };
  const chk = r => { if (r && r.error) throw erro(r.error); return r ? r.data : null };
  const snapDoc = (id, data) => ({ id, exists: data != null, data: () => data == null ? undefined : clone(data) });
  const snapCol = docs => ({ docs: docs.map(([id, d]) => snapDoc(id, d)), size: docs.length, empty: !docs.length, metadata: { fromCache: false } });

  const linhaMsg = r => [r.id, pick(r, MSG_CAMPOS)];
  let COLS_M = "uid,nome,criado_em,convidado_por,papel,suspenso_em,excluido_em";
  // banco ainda sem as colunas novas (SQL da leva 3 não rodado): volta às colunas antigas
  const membrosSel = async (q) => { const r = await q(COLS_M); if (r && r.error && /column|does not exist|42703/i.test((r.error.message || "") + r.error.code) && COLS_M.includes("papel")) { COLS_M = "uid,nome,criado_em,convidado_por"; return q(COLS_M) } return r };
  const linhaPessoa = r => [r.uid, { nome: r.nome, at: Date.parse(r.criado_em) || 0, convidado_por: r.convidado_por || null, papel: r.papel || "membro", suspenso: !!r.suspenso_em, excluido: !!r.excluido_em }];
  const linhaAmizade = r => [r.de + "_" + r.para, { de: r.de, para: r.para, status: r.status, criado_em: r.criado_em }];

  /* marca de tempo do servidor: o que já vimos de public.docs */
  let marca = 0;
  const viu = r => { const t = r && Date.parse(r.atualizado_em); if (t && t > marca) marca = t };

  async function lerDoc(path) {
    const i = path.indexOf("/"), c = path.slice(0, i), id = path.slice(i + 1);
    if (c === "pessoas") { const rows = chk(await membrosSel(cs => sb.from("membros").select(cs).eq("uid", id))); return rows && rows[0] ? linhaPessoa(rows[0])[1] : null }
    if (c === "mensagens") { const rows = chk(await sb.from("mensagens").select("*").eq("id", id)); return rows && rows[0] ? linhaMsg(rows[0])[1] : null }
    if (c === "erros") { const rows = chk(await sb.from("erros").select("*").eq("id", id)); return rows && rows[0] ? rows[0] : null }
    const rows = chk(await sb.from("docs").select("path,col,data,atualizado_em").eq("path", path));
    if (rows && rows[0]) viu(rows[0]);
    return rows && rows[0] ? rows[0].data : null;
  }
  async function lerCol(c, filtros) {
    let q;
    if (c === "pessoas") { let rows = chk(await membrosSel(cs => { let qq = sb.from("membros").select(cs); (filtros || []).forEach(([f, v]) => { qq = qq.eq(f, v) }); return qq })) || []; return rows.map(linhaPessoa).sort((x, y) => x[0] < y[0] ? -1 : 1) }
    if (c === "pessoas") q = null;
    else if (c === "mensagens") q = sb.from("mensagens").select("*");
    else if (c === "erros") q = sb.from("erros").select("*");
    else if (c === "amizades") q = sb.from("amizades").select("*");
    else q = sb.from("docs").select("path,data,atualizado_em").eq("col", c);
    (filtros || []).forEach(([f, v]) => { q = q.eq(f, v) });
    if (c === "mensagens") q = q.order("at", { ascending: false }).limit(MSG_MAX);
    if (c === "erros") q = q.order("at", { ascending: false }).limit(50);
    const rows = chk(await q) || [];
    const ord = a => a.sort((x, y) => x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0);
    if (c === "pessoas") return ord(rows.map(linhaPessoa));
    if (c === "mensagens") return rows.map(linhaMsg);
    if (c === "erros") return rows.map(r => [r.id, r]);
    if (c === "amizades") return ord(rows.map(linhaAmizade));
    rows.forEach(viu);
    return ord(rows.map(r => [r.path.slice(c.length + 1), r.data]));
  }

  /* ---------- escutas ----------
     Cada escuta tem: cheio() (lê tudo de novo), aplica(tabela, linha) -> true se resolveu sozinha. */
  const filtroOk = (filtros, row) => (filtros || []).every(([f, v]) => row && row[f] === v);
  function aplicarLinha(l, tabela, row) {
    if (l.tipo === "doc") {
      if (tabela !== "docs" || !row || row.path !== l.path) return true;
      if (!("data" in row)) return false;                       // linha grande demais veio sem os dados
      viu(row); l.poe(row.apagado ? null : row.data); return true;
    }
    const c = l.c;
    if (tabela === "amizades") return c === "amizades" ? false : true;   // tratado em mudouAmizade
    if (c === "pessoas") { if (tabela !== "membros") return true; if (!row || !row.uid) return false; const [id, d] = linhaPessoa(row); l.poeItem(id, row.apagado ? null : d); return true }
    if (c === "mensagens") {
      if (tabela !== "mensagens") return true; if (!row || !row.id) return false;
      if (!filtroOk(l.filtros, row)) return true;
      const [id, d] = linhaMsg(row); l.poeItem(id, row.apagado ? null : d); return true;
    }
    if (TAB[c]) return true;
    if (tabela !== "docs") return true;
    if (!row || !row.path) return false;
    if (row.col !== c && !row.path.startsWith(c + "/")) return true;
    if (!("data" in row)) return false;
    viu(row); l.poeItem(row.path.slice(c.length + 1), row.apagado ? null : row.data); return true;
  }
  function avisaLinha(tabela, row) {
    LIS.forEach(l => { if (!aplicarLinha(l, tabela, row)) l.agenda() });
  }

  function escuta(l, ler, monta, next, err) {
    let parado = false, t = 0, rodando = false, denovo = false, primeira = true, ultLeitura = null, ultDoc = null, sujo = false;
    l.estado = l.tipo === "doc" ? undefined : new Map();
    const entrega = () => {
      if (parado) return;
      const v = l.tipo === "doc" ? l.estado : [...l.estado.entries()];
      try { next(monta(v)) } catch (e) { console.error(e) }
    };
    let entT = 0; const entregaLogo = () => { clearTimeout(entT); entT = setTimeout(entrega, 40) };
    l.poe = (d) => { const k = JSON.stringify(d == null ? null : d); if (k === ultDoc) return; ultDoc = k; l.estado = d == null ? null : d; entregaLogo() };
    l.poeItem = (id, d) => {
      const ant = l.estado.get(id);
      if (d == null) { if (!l.estado.has(id)) return; l.estado.delete(id) }
      else { if (ant !== undefined && JSON.stringify(ant) === JSON.stringify(d)) return; l.estado.set(id, d) }
      if (l.c === "mensagens" && l.estado.size > MSG_MAX + 50) {   // mantém só as mais recentes
        const ord = [...l.estado.entries()].sort((a, b) => (b[1].at || 0) - (a[1].at || 0)); l.estado = new Map(ord.slice(0, MSG_MAX));
      }
      sujo = true; entregaLogo();
    };
    const roda = async () => {
      if (parado) return; if (rodando) { denovo = true; return } rodando = true;
      try {
        const v = await ler();
        if (!parado) {
          const k = JSON.stringify(v == null ? null : v);
          if (l.tipo === "doc") { if (k !== ultDoc || primeira) { ultDoc = k; l.estado = v == null ? null : v; entrega() } }
          else {
            const mudou = k !== ultLeitura;
            if (mudou || sujo || primeira) { l.estado = new Map(v); sujo = false; entrega(); if (mudou && !primeira && l.c === "amizades") mudouAmizade() }
            ultLeitura = k;
          }
          primeira = false;
        }
      }
      catch (e) { if (!parado && err) try { err(erro(e)) } catch (_) { } }
      rodando = false; if (denovo) { denovo = false; roda() }
    };
    l.agenda = () => { clearTimeout(t); t = setTimeout(roda, 150) };
    l.parar = () => { parado = true; clearTimeout(t); clearTimeout(entT) };
    LIS.add(l); roda();
    return () => { l.parar(); LIS.delete(l) };
  }

  /* ---------- releituras ---------- */
  let ultCheio = Date.now(), ultDelta = 0, deltaRodando = false;
  function cheioTodos() { ultCheio = Date.now(); LIS.forEach(l => l.agenda()) }
  let amzT = 0;
  function mudouAmizade() { clearTimeout(amzT); amzT = setTimeout(() => LIS.forEach(l => { if (!(l.tipo === "col" && l.c === "amizades")) l.agenda() }), 300) }

function barraAudio(){let b=$("#abar");document.body.classList.toggle("aud-on",!!AUD.on);if(!AUD.on){b?.remove();return}if(!b){b=document.createElement("div");b.id="abar";b.className="abar";document.body.appendChild(b)}const x=AUD.it[AUD.i]||{};const n=AUD.it.filter(y=>y.pid).length,k=AUD.it.slice(0,AUD.i+1).filter(y=>y.pid).length;
  b.innerHTML=`<button type="button" class="ab-t" ${x.pid?`data-goto="${esc(x.pid)}"`:""}><span>Ouvindo${x.pid?` · ${k} de ${n}`:""}</span><b>${esc(x.tit||"Prumo News")}</b></button><button type="button" data-aud="pp" aria-label="${AUD.pause?"Continuar":"Pausar"}">${AUD.pause?'<svg viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>':'<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>'}</button><button type="button" data-aud="next" aria-label="Próxima notícia"><svg viewBox="0 0 24 24"><path d="M6 5.5l9 6.5-9 6.5z"/><rect x="16" y="5.5" width="2.5" height="13" rx="1"/></svg></button><button type="button" data-aud="stop" aria-label="Parar"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></button>`}

function mostraErro(sel,msg){const el=$(sel);if(el){el.textContent=msg;el.hidden=false}}
function erroAuth(e){const m=String((e&&(e.message||e.code))||e||"").toLowerCase();
  if(/nome_unico|duplicate key|23505/.test(m))return "Já tem alguém com esse nome no Prumo. Use outro.";
  if(/nome_limpo/.test(m))return "Esse nome tem caracteres que não podem ser usados.";
  if(/invalid login|invalid_credentials|invalid credentials/.test(m))return "E-mail ou senha errados.";
  if(/already|registered|exists/.test(m))return "Este e-mail já tem conta. Use a aba Entrar.";
  if(/password/.test(m)&&/short|least|characters|weak|6/.test(m))return "A senha precisa ter pelo menos 6 caracteres.";
  if(/not confirmed/.test(m))return "Este e-mail ainda não foi confirmado. Fale com o Pedro.";
  if(/convite/.test(m))return "Convite inválido ou já usado.";
  if(/nome/.test(m))return "Escreva um nome de até 40 letras.";
  if(/email/.test(m)&&/invalid|valid|format/.test(m))return "Confira o e-mail.";
  if(/rate|too many|limit/.test(m))return "Muitas tentativas. Espere um pouco e tente de novo.";
  if(/fetch|network|failed|offline/.test(m))return "Sem conexão agora. Tente de novo.";
  return "Não deu certo agora. Tente de novo."}
function abrirLogin(aba,cod){aba=aba==="criar"?"criar":"entrar";const cria=aba==="criar",em=$("#lemail")?.value||"";

    <form id="lform" class="lform" novalidate>${cria?`<p class="hint" style="margin:0">O Prumo é só para convidados. O código vem no link que você recebeu.</p><label>Código do convite<input class="field" id="lcod" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" value="${esc(cod||CONVITE_URL||"")}"></label><label>Seu nome<input class="field" id="lnome" maxlength="40" autocomplete="given-name" placeholder="Como seus amigos vão te ver"></label>`:""}
    <label>E-mail<input class="field" id="lemail" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(em)}"></label>
    <label>Senha<input class="field" id="lsenha" type="password" autocomplete="${cria?"new-password":"current-password"}"${cria?' placeholder="Mínimo de 6 caracteres"':""}></label>
    <p class="erro-t" id="lerro" role="alert" hidden></p>
    <button class="btn" type="submit">${cria?"Criar conta":"Entrar"}</button>
    ${cria?"":`<button type="button" class="link" data-esqueci>Esqueci a senha</button><p class="hint" id="lesq" style="margin:0" hidden>Fale com o Pedro: ele redefine a sua senha.</p>`}</form>`);
  $("#lform").addEventListener("submit",e=>{e.preventDefault();if(cria)criarConta();else entrarConta()})}
async function entrarConta(){const em=$("#lemail").value.trim(),pw=$("#lsenha").value,b=$("#lform [type=submit]");
  if(!em||!pw)return mostraErro("#lerro","Preencha o e-mail e a senha.");
  const sb=sbCliente();if(!sb)return mostraErro("#lerro","O login não está disponível neste endereço.");
  b.disabled=true;try{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;closeLayer();await trocarSessao(r.data.user||r.data.session?.user);if(S.membro)toast("Olá, "+nomeDe(S.uid)+".")}catch(e){b.disabled=false;mostraErro("#lerro",erroAuth(e))}}
async function criarConta(){const cod=$("#lcod").value.trim().toUpperCase(),nome=$("#lnome").value.trim(),em=$("#lemail").value.trim(),pw=$("#lsenha").value,b=$("#lform [type=submit]");
  if(!nome)return mostraErro("#lerro","Escreva seu nome.");if(!em||!/^\S+@\S+\.\S+$/.test(em))return mostraErro("#lerro","Confira o e-mail.");if(pw.length<6)return mostraErro("#lerro","A senha precisa ter pelo menos 6 caracteres.");
  const sb=sbCliente();if(!sb)return mostraErro("#lerro","O login não está disponível neste endereço.");
  b.disabled=true;CRIANDO=true;
  try{const r=await sb.auth.signUp({email:em,password:pw});if(r.error)throw r.error;let user=r.data.user;
    if(!r.data.session){const r2=await sb.auth.signInWithPassword({email:em,password:pw});if(r2.error){CRIANDO=false;b.disabled=false;return mostraErro("#lerro","A conta foi criada, mas o e-mail precisa ser confirmado antes. Fale com o Pedro.")}user=r2.data.user}
    await trocarSessao(user);
    try{await usarConvite(cod,nome,user)}catch(e){CRIANDO=false;abrirFaltaConvite({codigo:cod,nome,erro:erroAuth(e)});return}
    CRIANDO=false;closeLayer();boasVindas(nome)}
  catch(e){CRIANDO=false;b.disabled=false;mostraErro("#lerro",erroAuth(e))}}

function adminDesenhar(){const b=$("#admbox"),k=S._admAba;if(!b||!k)return;if(k==="uso"){usoDesenhar();return}const L=S.adm[k]||[];const nm=u=>u?esc(S.membros[u]?.nome||"?"):"—";let h="";

  const dc=t.closest("[data-denc]");if(dc){abrirDenuncia("comentario",dc.dataset.du,dc.dataset.denc,dc.dataset.dp);return true}
  const rv=t.closest("[data-revogar]");if(rv){revogarConvite(rv.dataset.revogar,rv);return true}
  const cl=t.closest("[data-cvlink]");if(cl){linkConvite(cl.dataset.cvlink);return true}
  if(t.closest("[data-admin]")){abrirAdmin();return true}
  const aa=t.closest("[data-admaba]");if(aa){S._admAba=aa.dataset.admaba;document.querySelectorAll("[data-admaba]").forEach(x=>x.setAttribute("aria-selected",String(x===aa)));const b=$("#admbox");if(b)b.innerHTML=`<p class="hint">Carregando…</p>`;adminCarregar();return true}
  const ac_=t.closest("[data-admcota]");if(ac_){adminAcao("admin_cota",{p_uid:ac_.dataset.admcota,p_delta:1},"+1 convite para "+nomeDe(ac_.dataset.admcota));return true}
  const as_=t.closest("[data-admsusp]");if(as_){const on=as_.dataset.on==="1";if(on&&!as_.classList.contains("conf")){as_.classList.add("conf");as_.textContent="Toque de novo";return true}adminAcao("admin_suspender",{p_uid:as_.dataset.admsusp,p_suspender:on},on?"Conta suspensa.":"Conta reativada.");return true}
  const ap_=t.closest("[data-admapag]");if(ap_){if(!ap_.classList.contains("conf")){ap_.classList.add("conf");ap_.textContent="Toque de novo";return true}(async()=>{try{await S.db.rpc("admin_apagar_comentario",{p_uid:ap_.dataset.admapag,p_cid:ap_.dataset.cid});await S.db.rpc("admin_resolver_denuncia",{p_id:ap_.dataset.id,p_status:"resolvida"});toast("Comentário apagado.");adminCarregar()}catch(e){toast("Não deu agora.")}})();return true}
  const ad_=t.closest("[data-admden]");if(ad_){adminAcao("admin_resolver_denuncia",{p_id:ad_.dataset.admden,p_status:ad_.dataset.st});return true}
  if(t.closest("[data-excluir]")){abrirExcluir();return true}
  const xo=t.closest("[data-excluirok]");if(xo){excluirConta(xo);return true}
  if(t.closest("[data-addamigos]")){abrirAddAmigos();return true}
  if(t.closest("[data-convidar]")){abrirConvite();return true}
  if(t.closest("[data-gerarconvite]")){gerarConvite();return true}
  if(t.closest("[data-cvcopy]")){copiarConvite();return true}
  if(t.closest("[data-cvshare]")){enviarConvite();return true}
  const pe=t.closest("[data-pedir]");if(pe){pedirAmizade(pe.dataset.pedir,pe);return true}
  const ac=t.closest("[data-aceitar]");if(ac){responderAmizade(ac.dataset.aceitar,true);return true}
  const rc=t.closest("[data-recusar]");if(rc){responderAmizade(rc.dataset.recusar,false);return true}
  const cv=t.closest("[data-conversa]");if(cv){const u=cv.dataset.conversa;if(cv.closest(".sheet"))closeLayer();abrirConversa(u);return true}
  if(t.closest("[data-thmenu]")){if(THREAD)abrirThMenu(THREAD);return true}
  const df=t.closest("[data-desfazer]");if(df){confirmarDesfazer(df.dataset.desfazer);return true}
  const dk=t.closest("[data-desfazerok]");if(dk){desfazerAmizade(dk.dataset.desfazerok);return true}
  const ot=t.closest("[data-otrs]");if(ot){abrirAmigosPost(ot.dataset.otrs);return true}
  return false}

function espD(){const e=FEED&&FEED.esportes;return e&&typeof e==="object"?e:{}}

function espJogos(){return (Array.isArray(espD().jogos)?espD().jogos:[]).filter(j=>j&&j.a&&j.b&&j.data)}
function espComp(id){return espComps().find(c=>c.id===id)}

  const inner=`<span class="a ${cls("a")}">${esc(j.a)}</span>${meio}<span class="b ${cls("b")}">${esc(j.b)}</span>${info?`<span class="info">${esc(info)}</span>`:""}`;

function faListas(p,A){const L=[],T=A.temas||{},sec=secOf(p),tit=String((p.neutro||{}).titulo||"");
  const pe=p.foto_arquivo==="tema"?null:faPessoa(tit,A);if(pe&&Array.isArray(pe.fotos)&&pe.fotos.length)L.push(pe.fotos);
  const as=faAssunto(tit,A,sec);if(as&&Array.isArray(as.fotos)&&as.fotos.length)L.push(as.fotos);
  const t=T[sec+"/"+(p.subtema||"")];if(Array.isArray(t)&&t.length)L.push(t);
  const d=T[(A.padrao||{})[sec]];if(Array.isArray(d)&&d.length&&d!==t)L.push(d);return L}
function faValida(f){return f&&typeof f.url==="string"&&FOTO_OK.test(f.url)}
function faMapa(){const A=FOTOS_ARQ;if(!A||!FEED||!Array.isArray(FEED.pautas))return null;
  const k=(A.gerado||"")+"|"+(FEED.atualizado_em||"")+"|"+FEED.pautas.map(p=>p.id+":"+(p.prioridade||0)+":"+((p.neutro||{}).titulo||"")).join(",");
  if(FA_MAP&&FA_MAPK===k)return FA_MAP;
  const usados=new Set(),M={},pr=p=>typeof p.prioridade==="number"?p.prioridade:0;
  const ord=FEED.pautas.map((p,i)=>[p,i]).sort((a,b)=>pr(b[0])-pr(a[0])||a[1]-b[1]).map(x=>x[0]),dup=new Set();
  ord.forEach(p=>{const f=p&&p.foto;if(f&&faValida(f)){const n=faNome(f.url);if(usados.has(n))dup.add(p.id);else usados.add(n)}});
  ord.forEach(p=>{if(!p||!p.id||(p.foto&&faValida(p.foto)&&!dup.has(p.id)))return;
    const L=faListas(p,A),h=hashStr(p.id);let esc=null;
    for(const l of L){for(let j=0;j<l.length;j++){const f=l[(h+j)%l.length];if(faValida(f)&&!usados.has(faNome(f.url))){esc=f;break}}if(esc)break}
    if(!esc&&L.length){const f=L[0][h%L[0].length];if(faValida(f))esc=f}
    if(!esc&&dup.has(p.id))return;
    if(esc){usados.add(faNome(esc.url));M[p.id]={url:esc.url,credito:esc.credito||"Foto de arquivo: Wikimedia Commons",alt:esc.alt||"Foto de arquivo",arquivo:1}}});
  FA_MAP=M;FA_MAPK=k;return M}
const _fotoDe27=fotoDe;

function quebraLinhas(ctx,t,w){const ps=String(t).split(/\s+/),L=[];let l="";ps.forEach(p=>{const x=l?l+" "+p:p;if(ctx.measureText(x).width>w&&l){L.push(l);l=p}else l=x});if(l)L.push(l);return L}
function cartaoResumo(){const its=(FEED&&FEED.resumo_dia&&Array.isArray(FEED.resumo_dia.itens)?FEED.resumo_dia.itens:[]).filter(x=>x&&x.texto).slice(0,6);if(!its.length)return null;
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const SER='Georgia,"Times New Roman",serif',SAN='-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  g.fillStyle="#f3f4f6";g.fillRect(0,0,W,H);g.fillStyle="#ffffff";g.beginPath();g.roundRect?g.roundRect(48,250,W-96,H-380,36):g.rect(48,250,W-96,H-380);g.fill();
  g.fillStyle="#0f1522";g.font=`700 104px ${SER}`;g.textAlign="center";const wm="prumo";const ww=g.measureText(wm).width;g.fillText(wm,W/2-40,140);
  g.fillStyle="#b07a2a";g.font=`800 30px ${SAN}`;g.textAlign="left";g.fillText("NEWS",W/2-40+ww/2+12,140);
  g.textAlign="center";g.fillStyle="#5b6472";g.font=`700 30px ${SAN}`;g.fillText(capaEdicao().toUpperCase(),W/2,200);
  g.fillStyle="#0f1522";g.fillRect(96,222,W-192,4);
  g.textAlign="left";g.fillStyle="#9a6a1f";g.font=`800 32px ${SAN}`;g.fillText(resumoTitulo().toUpperCase(),100,320);
  let fs=44,lin;const corta=(l,n)=>l.length>n?[...l.slice(0,n-1),l[n-1].replace(/\s*\S*$/,"")+"…"]:l;for(;fs>=30;fs-=2){g.font=`600 ${fs}px ${SAN}`;lin=its.map(x=>corta(quebraLinhas(g,x.texto,W-300),3));const tot=lin.reduce((a,l)=>a+l.length,0)*fs*1.28+its.length*fs*0.9;if(tot<H-560)break}if(fs<30){fs=30;g.font=`600 30px ${SAN}`;for(const mx of [3,2,1]){lin=its.map(x=>corta(quebraLinhas(g,x.texto,W-300),mx));if(lin.reduce((a,l)=>a+l.length,0)*fs*1.28+its.length*fs*0.9<H-560)break}}
  let y=400;its.forEach((x,i)=>{g.fillStyle="#b07a2a";g.font=`700 ${fs+6}px ${SER}`;g.fillText(String(i+1),100,y);g.fillStyle="#0f1522";g.font=`600 ${fs}px ${SAN}`;
    lin[i].forEach((l,j)=>{g.fillText(l,170,y+j*fs*1.28)});y+=lin[i].length*fs*1.28+fs*0.9;if(i<its.length-1){g.fillStyle="#e5e7eb";g.fillRect(170,y-fs*0.95,W-270,2)}});
  g.textAlign="center";g.fillStyle="#0f1522";g.font=`800 36px ${SAN}`;g.fillText("prumonews.com.br",W/2,H-60);
  return c}
var RES_ARQ=null,RES_P=null;
function prepararResumo(){if(RES_P)return RES_P;const c=cartaoResumo();if(!c)return Promise.resolve(null);RES_P=new Promise(r=>c.toBlob(b=>{RES_ARQ=b?new File([b],"prumo-1-minuto.png",{type:"image/png"}):null;r(RES_ARQ)},"image/png"));return RES_P}
document.addEventListener("pointerdown",e=>{if(e.target&&e.target.closest&&e.target.closest("[data-1mshare]"))prepararResumo()},true);
async function mandarResumo(){uso("capa_1min_mandar");const file=RES_ARQ||await prepararResumo();RES_P=null;RES_ARQ=null;if(!file){toast("Sem resumo nesta edição.");return}const blob=file;
  const texto=`${resumoTitulo()} · Prumo News\nhttps://prumonews.com.br`;
  try{if(navigator.canShare&&navigator.canShare({files:[file],text:texto})){await navigator.share({files:[file],text:texto});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="prumo-1-minuto.png";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Imagem salva: é só mandar no WhatsApp.")}
document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest("[data-1mshare]");if(!b)return;e.stopPropagation();e.preventDefault();mandarResumo()},true);

/* página da pessoa: foto de arquivo, quem é e as notícias em que aparece */
function pessoaArq(k){const A=FOTOS_ARQ&&FOTOS_ARQ.pessoas;if(!A)return null;if(A[k])return A[k];return Object.values(A).find(x=>x&&Array.isArray(x.chaves)&&x.chaves.includes(k))||null}
function pautasDaPessoa(k){const A=pessoaArq(k),ch=[k,...((A&&A.chaves)||[])].filter(x=>typeof x==="string"&&x.length>=3);
  const pr=p=>typeof p.prioridade==="number"?p.prioridade:0;
  return (FEED.pautas||[]).filter(p=>{const n=p.neutro||{},t=[n.titulo,n.texto,p.subtitulo,...(n.pontos||[])].join(" ");return ch.some(c=>posPalavra(t,c)>=0)}).sort((a,b)=>tms(ultimaAtualizacao(b)||b.hora)-tms(ultimaAtualizacao(a)||a.hora)||pr(b)-pr(a))}
function abrirPessoa(k){const d=FEED.pessoas?.[k],A=pessoaArq(k),f=A&&Array.isArray(A.fotos)&&A.fotos.find(faValida),L=lente(),ps=pautasDaPessoa(k);
  sheet("Quem é",`<div class="pes">${f?`<div class="pes-f"><img src="${escU(fotoMini(f.url))}" alt="${esc(k)}" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>`:""}<div><b class="pes-n">${esc(k)}</b>${d?`<p class="pes-d">${esc(d)}</p>`:""}${f?`<small class="pes-c">${esc(creditoCurto(f.credito||""))}</small>`:""}</div></div>
  ${ps.length?`<h4 class="pes-h">Nas notícias (${ps.length})</h4><ul class="mud-l">${ps.slice(0,12).map(p=>`<li><button type="button" data-cpnovir="${esc(p.id)}"><b class="mud-k" style="color:${secCor(secOf(p))};background:none;border:1px solid currentColor">${esc(capaChapeu(p))}</b><span class="mud-t">${esc(versao(p,L).titulo)}</span><span class="mud-x">${esc(quando(ultimaAtualizacao(p)||p.hora))}</span></button></li>`).join("")}</ul>`:""}`)}

/* coberturas encerradas: como terminou, no topo da matéria */
function matDesfecho(p){if(p.status!=="encerrada")return "";const ups=(p.atualizacoes||[]).filter(u=>u&&u.texto);const u=ups.length?ups.reduce((a,b)=>tms(b.hora)>tms(a.hora)?b:a):null;
  const t=typeof p.desfecho==="string"&&p.desfecho.trim()?p.desfecho.trim():u?u.texto:"";if(!t)return "";return `<div class="mat-fim"><b>Como terminou</b><p>${esc(t)}</p></div>`}

{const _cl32=closeLayer;closeLayer=function(){const r=_cl32.apply(this,arguments);if(window.RECARGA_PEND&&VERSAO_NOVA)setTimeout(()=>{if(!temJanela()){try{sessionStorage.setItem("prumo-recarregou",VERSAO_NOVA)}catch(e){}location.reload()}},400);return r}}
