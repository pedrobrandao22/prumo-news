<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prumo News</title>
<script>
(function () {
  var m = location.pathname.match(/\/m\/([\w-]{1,80})\.html$/);
  location.replace(m ? "/#m=" + m[1] : "/");
})();
</script>
</head>
<body><p><a href="/">Abrir o Prumo News</a></p></body>
</html>
